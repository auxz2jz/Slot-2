name: Finish Era Fidelity Rebuild
on:
  push:
    paths:
      - '.github/workflows/rebuild-fidelity-fix.yml'
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Recover reviewed bundle
        shell: bash
        run: |
          awk '/^H4s/{print; exit}' .github/workflows/rebuild-fidelity.yml | base64 -d > /tmp/rebuild.tar.gz
          tar -xzf /tmp/rebuild.tar.gz -C "$GITHUB_WORKSPACE"
          rm -f .github/workflows/rebuild-fidelity.yml .github/workflows/rebuild-fidelity-fix.yml
      - name: Validate all JavaScript
        shell: bash
        run: |
          node --check core.js
          node --check nes1.js
          node --check nes2.js
          node --check snes.js
          cp n64.js /tmp/n64.mjs
          node --check /tmp/n64.mjs
      - name: Commit reviewed rebuild
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Ship reviewed four-era graphics and physics rebuild'
          git push origin HEAD:main
