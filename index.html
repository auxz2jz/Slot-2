function initN64(){setupSurface(320,240,false);return{p:{x:0,z:2.6,yaw:Math.PI,vx:0,vz:0,hp:8},enemy:{x:.2,z:-2,hp:8,hit:0},cam:{pitch:.34,dist:6.2},lock:true,attack:0,combo:0,roll:0,aLatch:false,bLatch:false,trees:[[-3,-3],[3.1,-3.2],[-3.4,2.4],[3.3,2.6]],rocks:[[-1.8,-1.3],[2,1.1]]}}
function camBasis(s){let p=s.p,c=s.cam,target=V(p.x,.8,p.z);let yaw=s.lock?Math.atan2(s.enemy.x-p.x,s.enemy.z-p.z):p.yaw;let sy=Math.sin(yaw),cy=Math.cos(yaw),cp=Math.cos(c.pitch),sp=Math.sin(c.pitch);let pos=V(target.x-sy*cp*c.dist,target.y+sp*c.dist,target.z-cy*cp*c.dist);let f=norm3(sub3(target,pos)),r=norm3(cross3(f,V(0,1,0))),u=cross3(r,f);return{pos,target,f,r,u}}
function project(p,s,b){let q=sub3(p,b.pos),X=dot3(q,b.r),Y=dot3(q,b.u),Z=dot3(q,b.f);if(Z<.1)return null;let focal=235;return{x:160+X/Z*focal,y:116-Y/Z*focal,z:Z}}
function poly(points,c,s,b){let ps=points.map(p=>project(p,s,b));if(ps.some(p=>!p))return;ctx.beginPath();ctx.moveTo(ps[0].x,ps[0].y);for(let i=1;i<ps.length;i++)ctx.lineTo(ps[i].x,ps[i].y);ctx.closePath();ctx.fillStyle=c;ctx.fill();ctx.strokeStyle='#0003';ctx.lineWidth=.5;ctx.stroke()}
function prism3(x,y,z,w,h,d,c,s,b,yaw=0){let cy=Math.cos(yaw),sy=Math.sin(yaw),pt=(dx,dy,dz)=>V(x+dx*cy-dz*sy,y+dy,z+dx*sy+dz*cy);let v=[pt(-w/2,0,-d/2),pt(w/2,0,-d/2),pt(w/2,h,-d/2),pt(-w/2,h,-d/2),pt(-w/2,0,d/2),pt(w/2,0,d/2),pt(w/2,h,d/2),pt(-w/2,h,d/2)];let faces=[[0,1,2,3],[4,7,6,5],[0,4,5,1],[1,5,6,2],[2,6,7,3],[3,7,4,0]],arr=faces.map(f=>({p:f.map(k=>v[k]),z:f.reduce((q,k)=>q+(project(v[k],s,b)?.z||0),0)/4})).sort((a,b2)=>b2.z-a.z);for(const f of arr)poly(f.p,c,s,b)}
function lowTree(x,z,s,b){prism3(x,0,z,.32,1.3,.32,'#65462e',s,b);for(let j=0;j<3;j++){let y=1+j*.45,r=.72-j*.12,top=V(x,y+.65,z),ring=[];for(let k=0;k<8;k++){let a=k*Math.PI/4;ring.push(V(x+Math.cos(a)*r,y,z+Math.sin(a)*r))}for(let k=0;k<8;k++)poly([top,ring[k],ring[(k+1)%8]],j%2?'#32623a':'#3f7442',s,b)}}
function lowHero(s,b){let p=s.p,yaw=p.yaw;prism3(p.x,0,p.z,.42,.62,.28,'#315d38',s,b,yaw);prism3(p.x,.62,p.z,.32,.30,.27,'#d7aa7e',s,b,yaw);prism3(p.x-.14,0,p.z,.13,.38,.16,'#5b3b28',s,b,yaw);prism3(p.x+.14,0,p.z,.13,.38,.16,'#5b3b28',s,b,yaw);let sx=Math.sin(yaw),sz=Math.cos(yaw),side=V(sz,0,-sx),armA=s.attack>0?Math.sin((.32-s.attack)/.32*Math.PI)*1.3:0,hand=V(p.x+side.x*.25+sx*.1,.53,p.z+side.z*.25+sz*.1),tip=V(hand.x+sx*(.65+.2*armA)+side.x*.25*armA,.58+Math.sin(armA)*.25,hand.z+sz*(.65+.2*armA)+side.z*.25*armA),h1=project(hand,s,b),h2=project(tip,s,b);if(h1&&h2){ctx.strokeStyle='#ddd6ad';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(h1.x,h1.y);ctx.lineTo(h2.x,h2.y);ctx.stroke()}}
function updateN64(dt,s){let i=input(),p=s.p,e=s.enemy;e.hit=Math.max(0,e.hit-dt);let mag=i.m,ang=Math.atan2(i.x,i.y)+(s.lock?Math.atan2(e.x-p.x,e.z-p.z):p.yaw),max=s.roll>0?4.4:2.35,targetX=mag?Math.sin(ang)*max*mag:0,targetZ=mag?Math.cos(ang)*max*mag:0,acc=mag?8.5:11;p.vx+=(targetX-p.vx)*Math.min(1,acc*dt);p.vz+=(targetZ-p.vz)*Math.min(1,acc*dt);p.x+=p.vx*dt;p.z+=p.vz*dt;if(mag>.08&&!s.lock)p.yaw=ang;if(s.lock)p.yaw=Math.atan2(e.x-p.x,e.z-p.z);p.x=clamp(p.x,-3.5,3.5);p.z=clamp(p.z,-3.5,3.5);let a=A();if(a&&!s.aLatch&&s.roll<=0){s.attack=.32;s.combo=(s.combo+1)%3}s.aLatch=a;let bb=B();if(bb&&!s.bLatch&&s.roll<=0){s.roll=.42;p.vx+=Math.sin(p.yaw)*1.2;p.vz+=Math.cos(p.yaw)*1.2}s.bLatch=bb;s.attack=Math.max(0,s.attack-dt);s.roll=Math.max(0,s.roll-dt);if(s.attack>0&&e.hit<=0&&Math.hypot(e.x-p.x,e.z-p.z)<1.15){e.hp--;e.hit=.24;e.x+=Math.sin(p.yaw)*.28;e.z+=Math.cos(p.yaw)*.28}hud.textContent=`♥ ${p.hp}/8   ENEMY ${Math.max(0,e.hp)}/8   LOCK ${s.lock?'ON':'OFF'}`;era.textContent='N64 · low-poly 3D · analog response';desc.textContent='N64-era target: true polygonal scene, perspective follow camera, analog acceleration/deceleration, Z-style target lock, facing toward target, roll burst, sword timing and hit knockback.'}
function renderN64(s){clear('#000');ctx.setTransform(scale,0,0,scale,(cvs.width-SW*scale)/2,(cvs.height-SH*scale)/2);let sky=ctx.createLinearGradient(0,0,0,150);sky.addColorStop(0,'#6c94b4');sky.addColorStop(1,'#c2c9a6');ctx.fillStyle=sky;ctx.fillRect(0,0,320,240);ctx.fillStyle='#547746';ctx.fillRect(0,118,320,122);let b=camBasis(s);for(let k=-4;k<=4;k++){let a=project(V(k,0,-4),s,b),d=project(V(k,0,4),s,b);if(a&&d){ctx.strokeStyle='#39593b';ctx.lineWidth=.6;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(d.x,d.y);ctx.stroke()}a=project(V(-4,0,k),s,b);d=project(V(4,0,k),s,b);if(a&&d){ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(d.x,d.y);ctx.stroke()}}for(const t of s.trees)lowTree(t[0],t[1],s,b);for(const r of s.rocks)prism3(r[0],0,r[1],.8,.45,.65,'#6c7068',s,b,.4);let e=s.enemy;if(e.hp>0){prism3(e.x,0,e.z,.55,.7,.48,e.hit>0?'#e1c36c':'#8d3d35',s,b,.1);let ep=project(V(e.x,.9,e.z),s,b);if(ep&&s.lock){ctx.strokeStyle='#f4d45f';ctx.lineWidth=2;ctx.beginPath();ctx.arc(ep.x,ep.y,12,0,Math.PI*2);ctx.stroke()}}lowHero(s,b)}
function switchMode(n){mode=n;document.querySelectorAll('.tab').forEach((b,i)=>b.classList.toggle('active',i===n));state=[initNes1,initNes2,initSnes,initN64][n]()}

addEventListener('keydown',e=>{keys.add(e.code);if(/^Digit[1-4]$/.test(e.code))switchMode(+e.code.slice(-1)-1);if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault()});addEventListener('keyup',e=>keys.delete(e.code));
const pad=document.getElementById('pad'),knob=document.getElementById('knob');let pid=null;function joy(e){let r=pad.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=e.clientX-cx,dy=e.clientY-cy,R=r.width*.34,m=Math.hypot(dx,dy);if(m>R){dx*=R/m;dy*=R/m}touch.x=dx/R;touch.y=dy/R;knob.style.transform=`translate(${dx}px,${dy}px)`}pad.addEventListener('pointerdown',e=>{pid=e.pointerId;pad.setPointerCapture(pid);joy(e)});pad.addEventListener('pointermove',e=>{if(e.pointerId===pid)joy(e)});function jend(e){if(e.pointerId!==pid)return;pid=null;touch.x=touch.y=0;knob.style.transform=''}pad.addEventListener('pointerup',jend);pad.addEventListener('pointercancel',jend);for(const [id,k] of [['aBtn','a'],['bBtn','b']]){let el=document.getElementById(id);el.addEventListener('pointerdown',e=>{touch[k]=true;el.setPointerCapture(e.pointerId)});el.addEventListener('pointerup',()=>touch[k]=false);el.addEventListener('pointercancel',()=>touch[k]=false)}
