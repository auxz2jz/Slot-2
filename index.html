<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Relic of Emberwood — Four Era Fidelity Lab</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#0a0e0b;color:#eee7d4;font-family:system-ui,-apple-system,Segoe UI,sans-serif;touch-action:none}
#app{height:100%;display:flex;flex-direction:column;max-width:1100px;margin:auto;background:#111713}
header{display:flex;gap:7px;align-items:center;flex-wrap:wrap;padding:7px 9px;background:#080b09;border-bottom:1px solid #334136}
.brand{font-weight:900;letter-spacing:.4px;margin-right:auto}.mode{border:1px solid #536457;background:#18201a;color:#eee7d4;border-radius:7px;padding:7px 9px;font-size:11px;font-weight:800}
.mode.active{background:#758653;color:#fff}
#stage{position:relative;flex:1;min-height:0;background:#000;display:flex;align-items:center;justify-content:center;overflow:hidden}
#game2d{width:100%;height:100%;display:block;image-rendering:pixelated;background:#000}
#threeHost{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:#000;overflow:hidden}
#threeHost canvas{display:block;max-width:100%;max-height:100%;image-rendering:auto}
#hud{position:absolute;left:8px;top:8px;z-index:5;background:#000b;border:1px solid #ffffff1c;border-radius:7px;padding:6px 8px;font:700 11px/1.25 ui-monospace,Consolas,monospace;white-space:pre-line;pointer-events:none}
#caption{position:absolute;left:8px;right:8px;bottom:7px;z-index:5;background:#000c;border-radius:7px;padding:7px 9px;font-size:10px;pointer-events:none}
#touch{height:142px;display:flex;align-items:center;justify-content:space-between;padding:8px 18px;background:#0b100c;border-top:1px solid #334136}
#pad{width:118px;height:118px;border-radius:50%;border:2px solid #71816c;background:radial-gradient(circle,#455846,#1b251d);position:relative}
#knob{width:50px;height:50px;border-radius:50%;position:absolute;left:32px;top:32px;background:radial-gradient(circle at 35% 28%,#d3dacb,#788474 58%,#3d483e)}
#acts{display:grid;grid-template-columns:58px 64px 64px;align-items:end;gap:9px}.act{width:64px;height:64px;border-radius:50%;border:2px solid #ffffff3a;color:#fff;font-weight:900;background:radial-gradient(circle at 35% 25%,#d15c4f,#74261f 72%);box-shadow:inset 0 -7px #0004}
.act.b{background:radial-gradient(circle at 35% 25%,#6577cf,#303a76 72%)}.act.z{width:58px;height:46px;border-radius:14px;background:linear-gradient(#6f806f,#384439);align-self:start;margin-top:5px}
footer{text-align:center;background:#0b100c;padding:3px 6px 5px;font-size:9px;opacity:.75}
@media(max-width:620px){.brand{width:100%;font-size:13px}.mode{font-size:9px;padding:6px}#touch{height:132px;padding-inline:12px}#pad{width:106px;height:106px}#knob{left:26px;top:26px}.act{width:56px;height:56px}#acts{grid-template-columns:50px 56px 56px;gap:7px}.act.z{width:50px;height:42px}}
</style></head><body><div id="app">
<header><div class="brand">RELIC OF EMBERWOOD · ERA FIDELITY LAB</div>
<button class="mode active" data-mode="0">NES I</button><button class="mode" data-mode="1">NES II</button><button class="mode" data-mode="2">SNES</button><button class="mode" data-mode="3">N64 3D</button></header>
<div id="stage"><canvas id="game2d"></canvas><div id="threeHost"></div><div id="hud"></div><div id="caption"></div></div>
<div id="touch"><div id="pad"><div id="knob"></div></div><div id="acts"><button id="zBtn" class="act z">Z</button><button id="bBtn" class="act b">B</button><button id="aBtn" class="act">A</button></div></div>
<footer>Move: D-pad / WASD · A: Space/Enter · B: Shift/B · Z: Z · 1–4 change era · N64: A dodge/action · B sword · Z target</footer>
</div>
<script src="core.js"></script><script src="nes1.js"></script><script src="nes2.js"></script><script src="snes.js"></script><script type="module" src="n64.js"></script>
</body></html>
